name: 问题反馈
description: 提交可复现的问题，帮助我们更快定位原因。
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请移除访问密钥、个人对话和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: Cursor Studio 版本
      placeholder: 例如 v1.0.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请从打开应用开始逐步描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
