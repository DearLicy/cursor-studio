name: 功能建议
description: 分享希望看到的产品体验改进。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述当前使用中的具体不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 可以描述理想的交互或结果，不需要提供技术方案。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充场景
      description: 可选，说明使用频率、相关页面或截图。
